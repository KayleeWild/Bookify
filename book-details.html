<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="book-details">
            <img src="https://via.placeholder.com/200x300" alt="Book Cover" class="book-cover">
            <div class="book-info">
                <h1 class="book-title">Book Title</h1>
                <span class="rating">⭐ 6.8</span>
                <p class="description">
                    This is a placeholder description for the book. It provides insight into the plot, themes, and general idea of what readers can expect.
                </p>
                <div class="details">
                    <p><strong>Author:</strong> John Doe</p>
                    <p><strong>Published:</strong> 2025-02-13</p>
                    <p><strong>Genre:</strong> Thriller, Adventure</p>
                    <p><strong>Pages:</strong> 320</p>
                </div>
                <div class="buttons">
                    <button class="btn read-now">Read Now</button>
                    <button class="btn favorite">Add to Favorite</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
